[project]
name = "tw-stock-tracker"
version = "0.1.0"
description = "台股自選股評分追蹤程式（個人自用）"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
claude = ["anthropic>=1.0"]   # AI_PROVIDER=claude 時才需要

[tool.pytest.ini_options]
testpaths = ["engine/tests"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["engine*"]
