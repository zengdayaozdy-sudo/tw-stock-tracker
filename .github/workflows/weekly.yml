name: 每週維護

# 觸發：Make 情境「台股追蹤｜排程中樞」週六 12 點（台灣時間）以 workflow_dispatch 啟動。
# 集保股權分散表於週五資料日後公布。不保留 GitHub 排程，避免同一天跑兩次（本流程沒有「已完成就略過」）。
on:
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAN: ${{ vars.PLAN || 'free' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_OWNER_USER_ID: ${{ secrets.LINE_OWNER_USER_ID }}
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: 套用資料庫結構
        run: python -m engine.cli migrate
      - name: 更新公司資料、產業別與股數
        run: python -m engine.cli companies
      - name: 更新產業族群與自訂族群
        run: python -m engine.cli seed-groups
      - name: 集保股權分散表（大戶持股）
        run: python -m engine.cli holders
      - name: 清理過舊紀錄
        run: python -m engine.cli maintenance
      - name: 失敗時推播系統警告
        if: failure()
        run: python -m engine.cli alert --message "每週維護失敗，請到 GitHub Actions 查看「每週維護」的執行紀錄"
