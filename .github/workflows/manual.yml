name: 手動操作

on:
  workflow_dispatch:
    inputs:
      command:
        description: 要執行的指令
        type: choice
        options:
          - probe
          - line-test
          - probe-mops
          - probe-url
          - news
          - fetch
          - score
          - filters
          - companies
          - seed-groups
          - watch-add
          - watch-remove
          - watch-list
          - backfill
          - plan
          - trade-buy
          - trade-sell
          - trade-list
          - stats
          - capital
          - backtest-data
          - backtest
          - backtest-holdout
      args:
        description: 參數（回測：--set risk.stop_loss.percent=0.06；自選股：2330 2317；買賣：2330 1050 1000 --date 2026-11-06（代號 價格 股數）；總資金：1500000）
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PLAN: ${{ vars.PLAN || 'free' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_OWNER_USER_ID: ${{ secrets.LINE_OWNER_USER_ID }}
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[backtest]"
      - name: 套用資料庫結構
        run: python -m engine.cli migrate
      - name: 執行
        env:
          CMD: ${{ inputs.command }}
          ARGS: ${{ inputs.args }}
        run: |
          case "$CMD" in
            probe|companies|seed-groups|plan) python -m engine.cli "$CMD" ;;
            probe-mops)       python -m engine.cli probe-mops $ARGS ;;
            line-test)        python -m engine.cli line-test ;;
            probe-url)        eval python -m engine.cli probe-url $ARGS ;;
            news)             python -m engine.cli news $ARGS ;;
            fetch)            python -m engine.cli fetch $ARGS ;;
            score)            python -m engine.cli score $ARGS ;;
            filters)          python -m engine.cli filters $ARGS ;;
            watch-add)    python -m engine.cli watch add $ARGS ;;
            watch-remove) python -m engine.cli watch remove $ARGS ;;
            watch-list)   python -m engine.cli watch list ;;
            backfill)     python -m engine.cli backfill $ARGS ;;
            trade-buy)    python -m engine.cli trade buy $ARGS ;;
            trade-sell)   python -m engine.cli trade sell $ARGS ;;
            trade-list)   python -m engine.cli trade list ;;
            stats)        python -m engine.cli stats ;;
            capital)      python -m engine.cli capital $ARGS ;;
            backtest-data)    python -m engine.cli backtest-data $ARGS ;;
            backtest)         python -m engine.cli backtest $ARGS ;;
            backtest-holdout) python -m engine.cli backtest --holdout $ARGS ;;
          esac
      - name: 上傳回測報告
        if: ${{ startsWith(inputs.command, 'backtest') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/
          if-no-files-found: ignore
