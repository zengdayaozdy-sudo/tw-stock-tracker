name: 每日收盤後批次

on:
  schedule:
    # 台灣時間（UTC+8）週一至週五 15:30 ＝ UTC 07:30。
    # GitHub 排程可能延遲數分鐘到數十分鐘；官方資料未更新時 fetch 最多再等 90 分鐘。
    # 休市日由 trading-day 步驟判斷後略過後續步驟。
    - cron: "30 7 * * 1-5"
    # 備援：GitHub 排程偶爾不觸發（2026-11-09 就沒有觸發）。17:00、19:00 再各排一次，
    # 當天已推播成功會在「判斷是否為交易日」步驟直接略過，不會重複推播。
    - cron: "0 9 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: 補跑日期 YYYY-MM-DD（留空為今天）
        required: false

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PLAN: ${{ vars.PLAN || 'free' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_OWNER_USER_ID: ${{ secrets.LINE_OWNER_USER_ID }}
      # AI 判讀：擁有者決定先用關鍵字（rules）；改用 Claude 時在 Variables 設 AI_PROVIDER=claude 並加 ANTHROPIC_API_KEY
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'rules' }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      TZ: Asia/Taipei
      DATE_ARG: ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[claude]"
      - name: 套用資料庫結構
        run: python -m engine.cli migrate
      - name: 同步網站設定
        run: python -m engine.cli sync-config
      - name: 判斷是否為交易日
        id: day
        run: python -m engine.cli trading-day $DATE_ARG ${{ github.event_name == 'schedule' && '--skip-if-done' || '' }}
      - name: 抓取資料與完整性檢查
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli fetch $DATE_ARG --wait-minutes ${{ inputs.date && '0' || '90' }}
      - name: 回補新加入的自選股
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli backfill-new
      - name: 流動性過濾
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli liquidity $DATE_ARG
      - name: 消息面排雷
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli news $DATE_ARG
      - name: 三面向評分
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli score $DATE_ARG
      - name: 大盤燈號、族群強弱、事件行事曆
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli filters $DATE_ARG
      - name: 買進訊號與參考價位
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli signals $DATE_ARG
      - name: 持股檢查與賣出提醒
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli holdings $DATE_ARG
      - name: LINE 每日報告
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli notify $DATE_ARG
      - name: 失敗時推播系統警告
        if: failure()
        run: python -m engine.cli alert $DATE_ARG
