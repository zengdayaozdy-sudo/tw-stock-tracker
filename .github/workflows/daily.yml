name: 每日收盤後批次

# 兩個階段，目標是晚上 24 點前全部資料更新完成，隔天開盤前可以照訊號操作：
#   main     收盤後：行情、法人、估值、評分、訊號、盤勢總結與隔日計畫、LINE 每日報告
#   evening  晚間補抓：當日融資融券、借券賣出、15:30 之後的重大訊息，重算評分與訊號，只推播有變動的部分
#
# 主要觸發：Make 情境「台股追蹤｜排程中樞」以 workflow_dispatch 啟動（交易日 17 點主流程、20 點補跑、23 點晚間補抓）。
# 備援觸發：下面的 GitHub 排程。GitHub 排程尖峰時可能延遲數小時（2026-11-10 延遲約 8 小時、2026-11-24 延遲約 11.5 小時）。
#
# 時間安排在官方資料「確定已公布」之後，抓取步驟不在 Actions 裡等待（等待時間一樣計入 Actions 用量；
# 2026-11 用量超過私人 repo 免費額度，排程被 GitHub 擋下）：
#   主流程 17:00 後：三大法人約 15:00–16:00 公布
#   晚間補抓 23:00 後：證交所融資融券晚間公布、時間不固定，櫃買約 22 點後
# 延遲到凌晨 08:00 以前才執行，處理的仍是前一個交易日；延遲到隔天白天（資料公布前）則直接略過（engine/cli.py 的 _too_early）。
# 同一階段當天已完成就在「判斷是否為交易日」步驟略過，不會重複推播。
on:
  schedule:
    # cron 為 UTC，台灣時間 ＝ UTC＋8
    - cron: "30 10 * * 1-5"  # 18:30 收盤後主流程（備援）
    - cron: "30 15 * * 1-5"  # 23:30 晚間補抓（備援）
  workflow_dispatch:
    inputs:
      date:
        description: 補跑日期 YYYY-MM-DD（留空為今天）
        required: false
      phase:
        description: main＝收盤後；evening＝晚間補抓
        required: false
        default: main
      source:
        description: 觸發來源（make＝Make 定時觸發，當天已完成就略過）
        required: false

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAN: ${{ vars.PLAN || 'free' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_OWNER_USER_ID: ${{ secrets.LINE_OWNER_USER_ID }}
      # AI 判讀：擁有者決定先用關鍵字（rules）；改用 Claude 時在 Variables 設 AI_PROVIDER=claude 並加 ANTHROPIC_API_KEY
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'rules' }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      TZ: Asia/Taipei
      DATE_ARG: ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      PHASE: ${{ inputs.phase || (github.event.schedule == '30 15 * * 1-5' && 'evening') || 'main' }}
      SKIP_IF_DONE: ${{ (github.event_name == 'schedule' || inputs.source == 'make') && '--skip-if-done' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[claude]"
      - name: 套用資料庫結構
        run: python -m engine.cli migrate
      - name: 同步網站設定
        run: python -m engine.cli sync-config
      - name: 判斷是否為交易日
        id: day
        run: python -m engine.cli trading-day $DATE_ARG --phase $PHASE $SKIP_IF_DONE
      - name: 抓取資料與完整性檢查
        if: steps.day.outputs.open == 'true'
        # 不等待：排程時間已排在官方資料公布之後。主流程資料若仍未公布，由下一次觸發（GitHub 18:30 備援、Make 20 點補跑）補上；
        # 晚間融資融券若仍缺，只列警告，隔天主流程再補。
        run: |
          if [ "$PHASE" = evening ]; then
            python -m engine.cli fetch $DATE_ARG --require-margin --wait-minutes 0
          else
            python -m engine.cli fetch $DATE_ARG --wait-minutes 0
          fi
      - name: 回補新加入的自選股
        if: steps.day.outputs.open == 'true' && env.PHASE == 'main'
        run: python -m engine.cli backfill-new
      - name: 流動性過濾
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli liquidity $DATE_ARG
      - name: 消息面排雷
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli news $DATE_ARG
      - name: 三面向評分
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli score $DATE_ARG
      - name: 大盤燈號、族群強弱、事件行事曆
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli filters $DATE_ARG
      - name: 買進訊號與參考價位
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli signals $DATE_ARG
      - name: 持股檢查與賣出提醒
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli holdings $DATE_ARG
      - name: 盤勢總結與隔日操作計畫
        if: steps.day.outputs.open == 'true'
        # 失敗不擋 LINE 推播：失敗紀錄會由下一步的系統警告一併送出
        continue-on-error: true
        run: python -m engine.cli summary $DATE_ARG
      - name: LINE 推播
        if: steps.day.outputs.open == 'true'
        run: python -m engine.cli notify $DATE_ARG ${{ env.PHASE == 'evening' && '--evening' || '' }}
      - name: 失敗時推播系統警告
        if: failure()
        run: python -m engine.cli alert $DATE_ARG
