# 濾網設定（不計入總分；初始值，回測後調整）

news:
  confidence_threshold: 0.7     # 判定為重大利空且信心度 ≥ 此值才排除
  lookback_days: 3              # 排除最近幾個日曆天內的利空（涵蓋週末公告）
  max_judgments_per_run: 200    # 每次最多判讀幾則，控制 AI 成本
  negative_event_types:
    - 財測下修
    - 處置
    - 董監大量申報轉讓
    - 重大訴訟
    - 現金增資
    - 虧損擴大
    - 停工或重大災害
  # AI 無法使用時的關鍵字備援判讀（比對標題與內文前段）
  rule_confidence: 0.75
  rule_keywords:
    財測下修: [財測下修, 下修財務預測, 調降財測]
    處置: [處置有價證券, 列為處置]
    董監大量申報轉讓: [申報轉讓, 持股轉讓]
    重大訴訟: [訴訟, 假扣押, 仲裁]
    現金增資: [現金增資, 現增]
    虧損擴大: [虧損擴大, 鉅額虧損, 重大虧損]
    停工或重大災害: [停工, 火災, 爆炸, 停產, 重大災害]
  # 財經新聞 RSS（選用）。{stock_id} 會換成股票代號；請只放條款允許自動讀取的來源
  rss_feeds: []

market_light:
  # 每項輸入給 +1 偏多 / 0 中性 / -1 偏空，加總後判斷燈號；缺資料的輸入以 0 計
  bullish_threshold: 2
  bearish_threshold: -2
  inputs:
    - taiex_vs_ma60
    - sox_trend
    - tsmc_adr_premium
    - foreign_futures_oi
    - twd_trend
  taiex_vs_ma60:
    ma_days: 60
    band: 0.01                  # 收盤高於季線 1% 以上偏多、低於 1% 以上偏空
    recovery_ma: 20             # 低於季線但已站回 20 日線時改判中性（null 停用）
  sox_trend:
    ma_days: 20
    slope_days: 5               # 均線方向：與 5 個交易日前比較
  tsmc_adr_premium:
    adr_ratio: 5                # 1 單位 ADR = 5 股普通股
    avg_days: 20
    band: 0.02                  # 溢價高於近 20 日平均 2 個百分點以上偏多
    min_observations: 10
    adr_trend_days: 5           # 溢價低於平均時，ADR（換算台幣）5 日沒有下跌＝台股補漲造成，改判中性（null 停用）
  foreign_futures_oi:
    bullish_level: 0            # 外資台指期淨未平倉（口）≥ 此值偏多
    bearish_level: -40000       # ≤ 此值偏空
    change_days: 5              # 介於兩者之間時看 5 日變化
    change_lots: 5000
    cover_lots: 8000            # 淨空單低於 bearish_level 但較 5 日內最大空單回補 8,000 口以上，改判中性（null 停用）
  twd_trend:
    change_days: 20
    band: 0.005                 # 美元兌台幣 20 日跌 0.5% 以上（台幣升值）偏多
  history_days: 200             # 每次至少保留多少日曆天的時間序列

rebound:
  # 大盤反彈偵測（領先型，見 engine/filters/rebound.py 與 docs/rebound-research.md）
  # 燈號偏空時，反彈確認／反彈嘗試可放行買進訊號，以反彈單處理（部位縮小、停損收緊，見 risk.yaml rebound_mode）
  enabled: true
  correction:
    lookback_days: 60           # 在近 60 個交易日找波段高點
    min_depth: 0.08             # 高點到低點跌幅至少 8% 才算修正
  rally:
    attempt_min_gain: 0.02      # 自低點反彈 2% 以上才算反彈嘗試
    max_days: 25                # 低點後超過 25 個交易日仍未確認，視為失敗的反彈
  ftd:                          # O'Neil 追蹤日：反彈第 4 天以後，指數單日大漲且量增
    min_day: 4
    max_day: 15
    min_gain: 0.0125
    require_volume_up: true     # 成交量（自選股合計）高於前一日
    points: 2
  power_rally:                  # 台股常見的 V 轉：自低點 5 個交易日內急漲
    max_days: 5
    min_gain: 0.06
    points: 1
  breadth_thrust:               # Zweig 寬度衝刺：上漲家數比率 10 日 EMA 由 0.40 以下衝上 0.615 以上
    ema_span: 10
    low: 0.40
    high: 0.615
    within_days: 10
    recent_days: 10             # 衝刺發生在最近 10 個交易日內才計入
    points: 2
  breadth_recovery:             # 站上 20 日線的比例：近期曾低於 20%，今天回到 50% 以上
    ma_days: 20
    oversold: 0.20
    recovered: 0.50
    lookback_days: 15
    points: 1
  short_covering:               # 外資台指期淨空單自 10 日內最大值回補
    lookback_days: 10
    min_lots: 10000
    points: 1
  min_stocks: 10                # 寬度指標至少要有幾檔股票
  confirm_points: 2             # 累積 2 點＝反彈確認

group_strength:
  lookback_days: [20, 60]       # 近 1／3 個月（交易日）
  rank_weights:                 # 綜合排名權重：相對大盤報酬與族群平均分數
    return_20: 0.35
    return_60: 0.35
    score: 0.30
  score_horizon: short          # 族群平均分數採用短線或中長線
  weak_bottom_pct: 0.3          # 排名後 30% 視為弱勢
  min_members: 1                # 族群內至少幾檔（在比較範圍內）才排名
  min_groups_for_weak: 3        # 可排名族群少於此數時不判定弱勢

events:
  warn_days_before: 2           # 事件前 N 個交易日開始提示
  warn_days_after: 1            # 事件後 N 個交易日仍提示
  keep_past_days: 30            # 抓取時保留多久以前的事件
  # MSCI 季度調整：只提示市值達門檻的股票（MSCI 台灣指數成分股多為大型股）
  # 日期來源：MSCI 官方 Index Review 時程表（https://www.msci.com/eqb/pressreleases/archive/ir_dates.pdf，2026-11-09 查詢）
  # 換股在生效日前一個交易日收盤進行
  index_review_min_market_cap: 30000000000
  index_reviews:
    - {name: MSCI 2026 年 11 月, announce: 2026-11-11, effective: 2026-12-01}
    - {name: MSCI 2027 年 2 月, announce: 2027-02-09, effective: 2027-03-01}
    - {name: MSCI 2027 年 5 月, announce: 2027-05-10, effective: 2027-05-28}
    - {name: MSCI 2027 年 8 月, announce: 2027-08-12, effective: 2027-09-01}
    - {name: MSCI 2027 年 11 月, announce: 2027-11-11, effective: 2027-12-01}
    - {name: MSCI 2028 年 2 月, announce: 2028-02-10, effective: 2028-03-01}
    - {name: MSCI 2028 年 5 月, announce: 2028-05-11, effective: 2028-06-01}
    - {name: MSCI 2028 年 8 月, announce: 2028-08-14, effective: 2028-09-01}
