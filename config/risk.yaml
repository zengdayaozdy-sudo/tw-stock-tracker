# 交易與風控規則（初始值，回測後調整）

position:
  risk_per_trade: 0.015        # 每筆最大虧損佔總資金比例
  max_position_pct: 0.12       # 單檔上限
  max_holdings: 8              # 持股檔數上限
  max_group_pct: 0.30          # 單一族群上限
  lot_size: 1000               # 一張股數

stop_loss:
  method: percent              # percent：進場參考價 −8%／ma60：跌破季線
  percent: 0.08
  bearish_market_percent: 0.05 # 大盤燈號偏空時收緊
  ma60_buffer: 0.01            # ma60 法：季線再往下 1% 才算跌破
  max_percent: 0.15            # ma60 法停損距離超過 15% 時改用 percent 法

take_profit:
  trailing_percent: 0.10       # 移動停利回落幅度（持股追蹤用）
  resistance_lookback_days: 120  # 前波壓力：近 120 個交易日最高價
  min_reward_pct: 0.05         # 壓力位至少要比進場價高 5% 才採用
  reward_risk_ratio: 2.0       # 找不到壓力位時，目標 = 進場價 + 2 倍停損距離

entry_zone:
  chase_pct: 0.01              # 區間上緣 = 收盤價 +1%（不追高）
  max_pullback: 0.08           # 支撐價離收盤價超過 8% 不採用
  default_pullback: 0.03       # 找不到支撐時，下緣 = 收盤價 −3%
  support_lookback_days: 20    # 近 20 日低點視為支撐

pe_river:                      # 本益比河流圖：以自身近 N 年本益比分位推算價位
  lookback_years: 3
  low_pct: 0.2                 # 偏低區：本益比第 20 百分位
  high_pct: 0.8                # 偏高區：本益比第 80 百分位
  min_observations: 120

exit:
  max_holding_days_no_gain: 20 # 持有超過此交易日數未上漲則提醒換股
  no_gain_threshold: 0.0       # 「未上漲」：收盤相對成本漲幅 ≤ 此值
  min_score: 50                # 短線與中長線分數都低於此值 → 分數跌出門檻
  score_drop_min_days: 0       # 持有未滿此交易日數不以分數出場（0＝不限制；回測比較 0／5／10）
  trailing_activation: 0.05    # 最高收盤曾高於成本 5% 以上才啟動移動停利
  signal_lookback_days: 5      # 登錄交易時，採用幾天內的訊號作為快照與停損停利

entry_conditions:
  - above_ma60                 # 站上季線
  - ma_golden_cross            # 均線黃金交叉
  - volume_breakout_20d        # 帶量突破 20 日高點
  - institutional_buy_streak   # 法人連續買超
trigger_window_days: 3            # 站上季線／黃金交叉：3 日內穿越且今天仍在上方即算（2026-11-10 回測調參區間年化 +42.3% → +49.6%）
institutional_buy_streak_days: 3  # 外資＋投信合計連續買超天數
volume_breakout_ratio: 1.5         # 成交量 ≥ 20 日均量 1.5 倍
golden_cross_ma: [5, 20]           # 黃金交叉：5 日線由下往上穿越 20 日線
breakout_days: 20

# 領先型進場條件（反彈期間由盤勢模式加入，見 rebound_mode）
oversold_reversal:
  lookback_days: 5             # 近 5 日內
  bias: 0.10                   # 曾低於 20 日線 10% 以上
  volume_ratio: 1.0            # 今天成交量 ≥ 20 日均量
rs_new_high:
  lookback_days: 120           # 股價÷加權指數創 120 日新高
  price_gap: 0.05              # 股價本身仍低於 120 日高點 5% 以上（RS 先於股價創高）
reclaim_ma20:
  slope_days: 5
  max_ma_decline: 0.01         # 20 日線 5 日內下彎超過 1% 不算（仍在下跌趨勢中）

rebound_mode:
  # 盤勢模式（engine/signals/regime.py）：燈號偏空時依反彈狀態放行買進訊號
  enabled: true
  confirmed:                   # 反彈確認（追蹤日、寬度衝刺等累積 2 點以上）
    allow: true
    size_factor: 0.5           # 單筆風險與單檔上限 × 0.5
  attempt:                     # 反彈嘗試（自低點反彈但證據不足）
    allow: true
    size_factor: 0.25          # 試單
  # 反彈期間（不論燈號）額外檢查的領先型進場條件
  entry_conditions:
    - oversold_reversal
    - rs_new_high
    - reclaim_ma20

costs:
  commission_rate: 0.001425    # 手續費
  commission_discount: 1.0     # 券商折扣
  min_commission: 20
  tax_rate: 0.003              # 證交稅（賣出）

liquidity:
  min_avg_volume_lots: 500     # 20 日均量低於此張數排除
  exclude_status:
    - disposition              # 處置
    - attention                # 注意
    - full_delivery            # 全額交割
