# 評分權重與門檻（初始值，回測後調整）

weights:
  short:          # 短線
    fundamental: 0.15
    technical: 0.50
    chips: 0.35
  long:           # 中長線
    fundamental: 0.60
    technical: 0.15
    chips: 0.25

# 各面向內指標權重；同一面向內加總需為 1
indicators:
  fundamental:
    revenue_growth: 0.22        # 月營收年增率、連續成長、創新高（權重最高）
    revenue_acceleration: 0.10  # 近 3 月年增率 − 近 12 月年增率（分析師上修的免費替代）
    eps_growth: 0.08
    earnings_surprise: 0.08     # 標準化未預期盈餘（SUE）
    margin_trend: 0.10
    roe: 0.07
    valuation_position: 0.08    # 本益比、淨值比相對歷史位置
    peg: 0.05                   # 本益比 ÷ 近四季 EPS 年增率
    order_backlog: 0.07         # 存貨天數年變化＋合約負債年增率
    balance_sheet: 0.05         # 負債比
    dividend: 0.05              # 只計入中長線
    analyst_revision: 0.05      # 受 feature flag（analyst_estimates）控制，需付費資料源
  technical:
    ma_alignment: 0.30
    momentum: 0.20
    volume_ratio: 0.15
    breakout: 0.15
    relative_strength: 0.20     # 近半年（排除最近一個月）相對加權指數報酬
  chips:
    foreign_net: 0.17
    trust_net: 0.17
    foreign_holding_change: 0.08
    trust_holding: 0.08         # 投信近 60 日累計買超佔股本
    margin: 0.10                # 融資大增反向扣分
    securities_lending: 0.10    # 借券賣出餘額大增反向扣分
    major_holders: 0.10
    pledge: 0.05                # 董監質押比 30% 以上扣分，以下為中性
    broker_branches: 0.15       # 受 feature flag 控制；停用時平均分給其他籌碼指標

# 只計入中長線的指標
long_only_indicators:
  - dividend

momentum_indicator: rsi         # rsi / kd / macd，回測決定

missing_value_score: 50          # 缺值以中性分處理
min_history_days: 240            # 資料不足此天數不評分
min_industry_size: 10            # 付費模式：產業少於此檔數改與全市場比較

selection:
  top_percent: 0.05              # 付費模式入選門檻
  per_group_top_n: 3             # 免費模式每個族群列出前幾名
  min_total: 60                  # 總分低於此值不進名單（避免弱族群的前幾名也入選）

# ---------- 計分細節 ----------
lookback_years: 3                 # 與自身歷史比較的期間
min_observations:                 # 自身歷史至少要有幾筆才比較
  daily: 60
  monthly: 12
  quarterly: 4
max_stale_days:                   # 資料超過幾天沒更新視為缺值
  daily: 7
  monthly: 75
  quarterly: 200
min_peers: 3                      # 免費模式同族群至少幾檔才比較

revenue_components:               # 月營收指標內部組成
  yoy: 0.60                       # 近 3 個月平均年增率（百分位）
  streak: 0.25                    # 連續年增月數
  new_high: 0.15                  # 營收創新高
  streak_cap_months: 6
  new_high_lookback_months: 12

horizon_overrides:                # 依短線／中長線調整單一指標權重，其餘等比例縮放
  short:
    chips:
      broker_branches: 0.30
  long:
    chips:
      broker_branches: 0.10

small_cap:
  market_cap_threshold: 30000000000   # 300 億以下視為中小型股
  trust_weight_boost: 1.5             # 投信權重加成

large_cap_top_n: 150              # 付費模式：市值前 N 名為大型股組

params:
  rsi_period: 14
  kd_period: 9
  macd: [12, 26, 9]
  chips_net_days: 5
  holding_change_days: 20
  margin_change_days: 5
  rs_lookback_days: 120             # 相對強弱：約半年
  rs_skip_days: 20                  # 排除最近一個月
  trust_holding_days: 60            # 投信累計買超天數
  sbl_change_days: 5                # 借券賣出餘額變化天數
