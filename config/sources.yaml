# 外部資料來源設定
# verified: true 代表已由官方文件確認；false 代表需在 GitHub Actions 執行
# `python -m engine.cli probe` 實測確認欄位後再改成 true。

finmind:
  base_url: https://api.finmindtrade.com/api/v4/data
  verified: true
  # 官方快速入門：有 token 每小時 600 次，無 token 300 次
  hourly_limit:
    free: 600
    sponsor: 6000      # 待確認：以官網方案頁為準
    pro: 6000
  safety_margin: 0.9   # 只用到上限的 90%
  datasets:
    stock_info: TaiwanStockInfo
    price: TaiwanStockPrice
    month_revenue: TaiwanStockMonthRevenue
    income_statement: TaiwanStockFinancialStatements
    balance_sheet: TaiwanStockBalanceSheet
    cash_flow: TaiwanStockCashFlowsStatement
    per: TaiwanStockPER
    dividend: TaiwanStockDividend
    institutional: TaiwanStockInstitutionalInvestorsBuySell
    margin: TaiwanStockMarginPurchaseShortSale
    shareholding: TaiwanStockShareholding
    holding_distribution: TaiwanStockHoldingSharesPer   # 付費
    broker_report: TaiwanStockTradingDailyReport        # Sponsor（單檔）；全市場需 Sponsor Pro
    # 大盤燈號輸入（2026-11-08 實測不帶 token 也可取得）
    us_price: USStockPrice                              # data_id：^SOX、TSM
    exchange_rate: TaiwanExchangeRate                   # data_id：USD
    futures_institutional: TaiwanFuturesInstitutionalInvestors  # data_id：TX
    # 還原股價用（2026-11-09 實測免費可取得；TaiwanStockPriceAdj 需付費）
    dividend_result: TaiwanStockDividendResult          # 除權息前後參考價
    split_price: TaiwanStockSplitPrice                  # 股票分割
    capital_reduction: TaiwanStockCapitalReductionReferencePrice  # 減資
    # 2026-11-09 實測免費：借券賣出餘額歷史（SBLShortSalesCurrentDayBalance）
    short_sale_balances: TaiwanDailyShortSaleBalances

# 每日排程自動回補新加入的自選股：依本小時剩餘 FinMind 額度決定檔數（每檔約 11 次呼叫）
backfill_new:
  max_per_run: 40      # 單次上限，避免排程跑太久延後每日報告
  min_per_run: 0       # 額度不足時不回補（不等下一個整點），留給下次排程

twse:
  verified: true   # 2026-11-08 probe 確認，2026-11-06 實際抓取全市場驗證
  endpoints:
    daily_all: https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL
    # 網站版：當天收盤後即更新（OpenAPI 版約晚一個交易日），2026-11-09 probe 確認；查無資料時改用 OpenAPI
    daily_all_site: https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date={date}&type=ALLBUT0999&response=json
    valuation_site: https://www.twse.com.tw/rwd/zh/afterTrading/BWIBBU_d?date={date}&selectType=ALL&response=json
    valuation_all: https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL
    margin_all: https://openapi.twse.com.tw/v1/exchangeReport/MI_MARGN
    company_info: https://openapi.twse.com.tw/v1/opendata/t187ap03_L
    disposition: https://openapi.twse.com.tw/v1/announcement/punish
    attention: https://openapi.twse.com.tw/v1/announcement/notice
    institutional: https://www.twse.com.tw/rwd/zh/fund/T86?date={date}&selectType=ALLBUT0999&response=json
    taiex_history: https://www.twse.com.tw/rwd/zh/TAIEX/MI_5MINS_HIST?date={date}&response=json
    # 2026-11-09 實測：信用額度總量管制餘額表，當天更新；「當日餘額」欄為借券賣出餘額
    sbl_site: https://www.twse.com.tw/rwd/zh/marginTrading/TWT93U?date={date}&response=json
    # 2026-11-11 實測：融資融券彙總（全部），晚間公布當天資料；表格「今日餘額」第一個是融資、第二個是融券
    margin_site: https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date={date}&selectType=ALL&response=json
    # 2026-11-09 實測：董監質權設定占持有股數彙總表，依百分比級距列出公司（約每月更新）
    pledge: https://openapi.twse.com.tw/v1/opendata/t187ap09_L
    # 第 4 階段（2026-11-08 實測）
    full_delivery: https://openapi.twse.com.tw/v1/exchangeReport/TWT85U      # 變更交易（全額交割）
    announcements: https://openapi.twse.com.tw/v1/opendata/t187ap04_L        # 每日重大訊息
    ex_dividend: https://openapi.twse.com.tw/v1/exchangeReport/TWT48U_ALL    # 除權除息預告表
    shareholder_meetings: https://openapi.twse.com.tw/v1/opendata/t187ap41_L # 股東會日期
    month_revenue_all: https://openapi.twse.com.tw/v1/opendata/t187ap05_L    # 上市公司每月營收彙總（2026-11-12 實測 1,076 家）
    holidays: https://openapi.twse.com.tw/v1/holidaySchedule/holidaySchedule # 開休市日期
    # 盤中即時行情（基本市況報導網站，上市 tse_、上櫃 otc_ 都可查；2026-11-08 實測）
    realtime: https://mis.twse.com.tw/stock/api/getStockInfo.jsp

tpex:
  verified: true   # 2026-11-08 probe 確認
  endpoints:
    daily_all: https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes
    valuation_all: https://www.tpex.org.tw/openapi/v1/tpex_mainboard_peratio_analysis
    margin_all: https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance
    company_info: https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O
    institutional: https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading
    # 第 4 階段（2026-11-08 實測）
    disposition: https://www.tpex.org.tw/openapi/v1/tpex_disposal_information
    attention: https://www.tpex.org.tw/openapi/v1/tpex_trading_warning_information
    trading_mode: https://www.tpex.org.tw/openapi/v1/tpex_cmode               # 變更交易（全額交割）、管理股票
    announcements: https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap04_O
    # 2026-11-09 實測：融券借券賣出餘額（SecuritiesBorrowingBalanceOfTheMarketDay）
    sbl: https://www.tpex.org.tw/openapi/v1/tpex_margin_sbl
    pledge: https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap09_O
    ex_dividend: https://www.tpex.org.tw/openapi/v1/tpex_exright_prepost
    shareholder_meetings: https://www.tpex.org.tw/openapi/v1/t187ap41_O
    month_revenue_all: https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap05_O  # 上櫃公司每月營收彙總（2026-11-12 實測 897 家）

tdcc:
  verified: true   # 2026-11-09 實測：CSV，約 7 萬列，只有最新一週
  # 集保股權分散表（每週），免費模式用
  holding_distribution: https://opendata.tdcc.com.tw/getOD.ashx?id=1-5
  major_holder_min_level: 12   # 分級 12（400,001 股以上＝400 張以上）到 15 視為大戶

ai:
  ollama_timeout_seconds: 120
  claude_model: claude-opus-5-5   # 可用環境變數 ANTHROPIC_MODEL 覆寫

# 公開資訊觀測站新版 API（2026-11-09 於 GitHub Actions 實測）
# 列表：POST {year: 民國年, month, day} → result.data = [[發言日期, 發言時間, 代號, 名稱, 主旨, {parameters}], ...]
#      上市、上櫃、興櫃、公開發行全部一起回傳（一天約 600 則）；每日清單含前一日 17:30 以後的訊息
# 明細：POST 列表每筆的 parameters → result.titles 與 result.data，取「說明」欄
mops:
  verified: true
  announcements: https://mops.twse.com.tw/mops/api/t05st02
  announcement_detail: https://mops.twse.com.tw/mops/api/t05st02_detail
  page: https://mops.twse.com.tw/mops/#/web/t05st02
  max_details_per_run: 80      # 只有自選股的訊息才抓明細，每次上限

http:
  timeout_seconds: 30
  max_retries: 4
  backoff_base_seconds: 2
  user_agent: tw-stock-tracker/0.1
